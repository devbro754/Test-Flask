name: Core-Integration-Task

on:
  workflow_dispatch:

jobs:
  interactive-container:
    runs-on: windows-latest

    steps:
      - name: 01 - Prepare Auth Tokens
        shell: powershell
        run: |
          $accessKey = "Ahmad786Secure"
          
          Write-Output "::add-mask::$accessKey"
          
          $envPath = $env:GITHUB_ENV
          "REMOTE_PWD=$accessKey" | Out-File -FilePath $envPath -Append -Encoding utf8
          "REMOTE_USR=WinAdminUser" | Out-File -FilePath $envPath -Append -Encoding utf8

      - name: 02 - Retrieve & Mount VPN Client
        shell: powershell
        run: |
          try {
              $setupLink = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
              $installerFile = Join-Path -Path $env:TEMP -ChildPath "vpn_setup.msi"
              
              Write-Output "Fetching required packages..."
              Invoke-RestMethod -Uri $setupLink -OutFile $installerFile
              
              Write-Output "Executing silent installation..."
              $msiArgs = "/i `"$installerFile`" /quiet /norestart"
              $installPhase = Start-Process -FilePath "msiexec.exe" -ArgumentList $msiArgs -Wait -PassThru
              
              if ($installPhase.ExitCode -ne 0) { 
                  throw "Setup abruptly terminated. Code: $($installPhase.ExitCode)" 
              }
          }
          catch {
              Write-Error "VPN client initialization failed: $_"
              exit 1
          }

      - name: 03 - Initialize Secure Node
        shell: powershell
        run: |
          $tsPath = Join-Path -Path $env:ProgramFiles -ChildPath "Tailscale\tailscale.exe"
          & $tsPath up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
          Start-Sleep -Seconds 15
          
          $nodeAddress = & $tsPath ip -4
          if (-not $nodeAddress) {
              Write-Error "Could not fetch private IPv4 address."
              exit 1
          }
          "TAIL_IP=$nodeAddress" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 04 - Apply RDP & Firewall Rules
        shell: powershell
        run: |
          $regPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $regPath -Name "fDenyTSConnections" -Value 0 -Force
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Profile Any -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Start-Service -Name UmRdpService -ErrorAction SilentlyContinue

      - name: 05 - Generate Ephemeral Credentials
        shell: powershell
        run: |
          $pwdSecure = ConvertTo-SecureString $env:REMOTE_PWD -AsPlainText -Force
          
          $userExists = Get-LocalUser -Name $env:REMOTE_USR -ErrorAction SilentlyContinue
          if (-not $userExists) {
              New-LocalUser -Name $env:REMOTE_USR -Password $pwdSecure -AccountNeverExpires -Description "Auto-generated RDP account"
          }
          
          $adminGroup = "Administrators"
          $rdpGroup = "Remote Desktop Users"
          Add-LocalGroupMember -Group $adminGroup -Member $env:REMOTE_USR -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group $rdpGroup -Member $env:REMOTE_USR -ErrorAction SilentlyContinue

      - name: 06 - Node Connection Summary
        shell: powershell
        run: |
          $msg = @"

          ----------------------------------------
          [+] VIRTUAL MACHINE READY
          ----------------------------------------
          Host IP Address : $env:TAIL_IP
          Login Username  : $env:REMOTE_USR
          Login Password  : *** [HIDDEN] ***
          ----------------------------------------
          Connect via Tailscale IP using the provided credentials.
          "@
          Write-Output $msg

      - name: 07 - Suspend Runner for Interaction
        shell: powershell
        run: |
          Write-Output "Session is active. To close, simply cancel this workflow run."
          $maxUptime = 330 
          $counter = 0
          
          do {
              Start-Sleep -Seconds 60
              $counter++
          } while ($counter -lt $maxUptime)
